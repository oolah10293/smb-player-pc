name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve modules
        run: go mod tidy

      - name: Build
        shell: powershell
        run: go build -ldflags="-H windowsgui" -o SMBPlayerPC_v0.3.1.exe .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SMBPlayerPC-v0.3.1-Windows
          path: SMBPlayerPC_v0.3.1.exe
